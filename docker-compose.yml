services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: confluence_reviewer
      POSTGRES_USER: confluence_reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confluence_reviewer -d confluence_reviewer"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Внутри compose-сети БД доступна по хосту db
      DATABASE_URL: postgresql+psycopg2://confluence_reviewer:${POSTGRES_PASSWORD}@db:5432/confluence_reviewer
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
